<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>acp-tap</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --line: #232733;
    --fg: #e6e8ee;
    --dim: #7d8496;
    --accent: #6ee7a8;
    --thought: #9a8cff;
    --tool: #f0b866;
    --msg: #6ee7a8;
    --err: #ff7a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height: 100vh; display: grid; grid-template-columns: 260px 1fr;
  }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px;
  }
  header b { font-size: 14px; letter-spacing: .04em; }
  header span { color: var(--dim); font-size: 11px; }
  .agent {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .agent:hover { background: #1b1f2a; }
  .agent.sel { background: #1e2430; box-shadow: inset 2px 0 0 var(--accent); }
  .agent .top { display: flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.on { background: var(--accent); }
  .dot.busy { background: var(--tool); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .agent .meta { color: var(--dim); font-size: 11px; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #feed { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .ev { display: grid; grid-template-columns: 62px 90px 1fr; gap: 10px; padding: 3px 0; align-items: start; }
  .ev .t { color: var(--dim); }
  .ev .k { text-transform: uppercase; font-size: 10px; letter-spacing: .06em; padding-top: 2px; }
  .ev .b { white-space: pre-wrap; word-break: break-word; }
  .thought .k, .thought .b { color: var(--thought); }
  .tool .k, .tool .b { color: var(--tool); }
  .message .k { color: var(--msg); }
  .error .k, .error .b { color: var(--err); }
  .turn_started .k, .turn_ended .k { color: var(--fg); }
  .turn_started .b { color: var(--dim); }
  .lbl { color: var(--dim); }
  #empty { color: var(--dim); padding: 40px 16px; }
</style>
</head>
<body>
<aside>
  <header><b>acp-tap</b><span id="status">connecting…</span></header>
  <div id="agents"></div>
</aside>
<main>
  <header><b id="title">all agents</b><span id="counts"></span></header>
  <div id="feed"><div id="empty">Waiting for ACP traffic…</div></div>
</main>
<script>
const agents = new Map();
let events = [];
let selected = null;

const $ = id => document.getElementById(id);
const time = ms => new Date(ms).toTimeString().slice(0, 8);

function agentRow(a) {
  const busy = a.connected && a.turn_started_ms;
  const cls = busy ? 'busy' : (a.connected ? 'on' : '');
  const since = a.turn_started_ms ? `turn ${Math.round((Date.now() - a.turn_started_ms) / 1000)}s` :
                a.last_activity_ms ? `idle ${Math.round((Date.now() - a.last_activity_ms) / 1000)}s` : 'no traffic';
  return `<div class="agent ${selected === a.label ? 'sel' : ''}" data-label="${a.label}">
    <div class="top"><span class="dot ${cls}"></span><span>${a.label}</span></div>
    <div class="meta">${since} · ${a.turns} turns · ${a.tool_calls} tools</div>
  </div>`;
}

function renderAgents() {
  const list = [...agents.values()].sort((a, b) => a.label.localeCompare(b.label));
  $('agents').innerHTML = list.map(agentRow).join('') ||
    '<div class="agent"><div class="meta">no taps connected</div></div>';
  for (const el of document.querySelectorAll('.agent[data-label]')) {
    el.onclick = () => {
      selected = selected === el.dataset.label ? null : el.dataset.label;
      $('title').textContent = selected || 'all agents';
      renderAgents(); renderFeed();
    };
  }
}

function body(e) {
  switch (e.kind) {
    case 'thought': case 'message': return e.text;
    case 'turn_started': return e.text;
    case 'turn_ended': return e.stop_reason;
    case 'tool_call': return `${e.title} (${e.tool_kind}) ${e.status}`;
    case 'tool_update': return `${e.tool_id} → ${e.status}`;
    case 'plan': return `${e.entries} entries`;
    case 'session_created': return e.session_id;
    case 'error': return e.message;
    default: return '';
  }
}

function renderFeed() {
  const shown = selected ? events.filter(e => e.label === selected) : events;
  const feed = $('feed');
  const stick = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40;
  feed.innerHTML = shown.length ? shown.slice(-600).map(e => `<div class="ev ${e.kind}">
      <span class="t">${time(e.ts_ms)}</span>
      <span class="k">${selected ? e.kind.replace('_', ' ') : `<span class="lbl">${e.label}</span>`}</span>
      <span class="b">${escapeHtml(body(e))}</span>
    </div>`).join('') : '<div id="empty">Waiting for ACP traffic…</div>';
  if (stick) feed.scrollTop = feed.scrollHeight;
  $('counts').textContent = `${shown.length} events`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => $('status').textContent = 'live';
  ws.onclose = () => { $('status').textContent = 'reconnecting…'; setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      agents.clear();
      for (const a of msg.agents) agents.set(a.label, a);
      events = msg.events;
    } else if (msg.type === 'event') {
      events.push(msg);
      if (events.length > 3000) events = events.slice(-2000);
    } else if (msg.type === 'agent') {
      agents.set(msg.label, msg);
    }
    renderAgents(); renderFeed();
  };
}

connect();
setInterval(renderAgents, 1000);
</script>
</body>
</html>
